[project]
name = "field-meeting-crm-backend"
version = "0.1.0"
description = "Backend for the NBFC field meeting management system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "argon2-cffi>=23.1",
    "mcp>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
